[package]
name = "ttydash"
version = "0.2.5"
edition = "2021"
description = "A terminal-based dashboard for real-time data visualization."
authors = ["PuQing <me@puqing.work>"]
build = "build.rs"
repository = "https://github.com/AndPuQing/ttydash"
license = "MIT"
exclude = ["assets/", ".github/"]
readme = "README.md"
keywords = ["tty", "plot", "dashboard", "cli", "terminal"]

[dependencies]
better-panic = "0.3.0"
clap = { version = "4.4.5", features = [
    "derive",
    "cargo",
    "wrap_help",
    "unicode",
    "string",
    "unstable-styles",
] }
color-eyre = "0.6.3"
config = "0.15.0"
crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
derive_deref = "1.1.1"
directories = "6.0.0"
futures = "0.3.30"
human-panic = "2.0.1"
json5 = "1.0.0"
lazy_static = "1.5.0"
libc = "0.2.158"
ratatui = { version = "0.30.0", features = [
    "serde",
    "macros",
    "unstable-widget-ref",
] }
regex = "1.10.6"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
signal-hook = "0.4.0"
strip-ansi-escapes = "0.2.0"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.4.0", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "io-util",
    "io-std",
] }
tokio-util = "0.7.11"
tracing = "0.1.40"
tracing-error = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "serde"] }
unicode-width = "0.2.0"

[build-dependencies]
anyhow = "1.0.86"
vergen-gix = { version = "10.0.0", features = ["build", "cargo"] }

[dev-dependencies]
pretty_assertions = "1.4.0"

[profile.release]
codegen-units = 1
strip = true
lto = true
opt-level = "z"
